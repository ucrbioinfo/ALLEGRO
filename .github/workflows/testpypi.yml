name: Build and Publish to TestPyPI

on:
  workflow_dispatch: # Allows us to manually trigger the workflow from GitHub
  release:
    types: [published] # Automatically triggers when we publish a GitHub Release

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] 
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Just in case you ever switch to submodules

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_SKIP: "cp36-* cp37-* cp38-* cp39-* pp*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          # IMPORTANT: Ensure build tools are present in the build container
          CIBW_BEFORE_BUILD: "pip install cmake patchelf"
          
          # Speed up build and handle the specific Linux environment
          CIBW_ENVIRONMENT: "CMAKE_BUILD_PARALLEL_LEVEL=2"
          
          # Testing: Run a basic import test to ensure the .so linked correctly
          CIBW_TEST_COMMAND: "python -c 'import allegro; print(\"ALLEGRO successfully installed\")'"
          
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/allegro-bio
    permissions:
      id-token: write  # Required for Trusted Publishing
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
